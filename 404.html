  <script type="module">
    let directory = new URL('./', location.href);
    // Hosts may serve this page at the original missing URL.
    while (true) {
      try {
        const response = await fetch(new URL('data/site.json', directory));
        if (response.ok && (await response.json()).name === 'YUGE ARCHIVE.') break;
      } catch {
        // Continue at the next parent directory.
      }
      const parent = new URL('../', directory);
      if (parent.href === directory.href) break;
      directory = parent;
    }
    for (const element of document.querySelectorAll('link[data-href], a[href], img[data-src]')) {
      const attribute = element.matches('img') ? 'src' : 'href';
      const value = element.dataset[attribute] ?? element.getAttribute(attribute);
      if (!value.startsWith('#')) element.setAttribute(attribute, new URL(value, directory));
    }
    await import(new URL('js/main.js', directory));
  </script>
